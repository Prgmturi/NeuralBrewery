# Elenco dei documenti tecnici per il RAG.
#
# Ogni [[doc]] è un documento. I campi `component` e `tags` diventano metadati
# dei chunk: permettono di filtrare la ricerca ("solo documenti di TT3")
# senza estrarre relazioni con un LLM.
#
# source:
#   ufficiale    -> sito del produttore
#   distributore -> copia ospitata da un distributore autorizzato
#   terzi        -> copia su un sito di manuali: meglio sostituirla con l'originale
#
# url  -> il file da cui viene la copia; page -> la pagina da cui prenderlo a mano.
#
# Ogni documento sta nel repo, in data/manuals/<id>.pdf (o .md), e il testo che
# l'app legge in data/manuals/text/<id>.md: lo scrive scripts/extract_manuals.py.

